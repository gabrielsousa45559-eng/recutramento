services:
  - type: web
    name: staff-da-nobre
    runtime: node
    plan: free
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: recrutamento-db
          property: connectionString

databases:
  - name: recrutamento-db
    plan: 0.1c-256mb
    databaseName: recrutamento
    user: recrutamento
    ipAllowList: []
